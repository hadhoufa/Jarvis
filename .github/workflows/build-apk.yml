name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf automake libtool pkg-config m4 autopoint gettext \
            zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev \
            build-essential cmake libltdl-dev libbz2-dev libreadline-dev \
            libsqlite3-dev libgdbm-dev libgdbm-compat-dev liblzma-dev uuid-dev \
            ant

      - name: Install Buildozer
        run: |
          pip3 install --user --upgrade buildozer Cython==0.29.36 virtualenv

      - name: Download Legacy SDK Tools (Forced)
        run: |
          # إنشاء مجلد SDK المتوقع
          SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_ROOT
          cd $SDK_ROOT
          # تنزيل الأدوات القديمة التي تحتوي على sdkmanager في tools/bin
          curl -L -O https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip
          unzip -q sdk-tools-linux-4333796.zip
          # الموافقة على التراخيص
          echo "y" | $SDK_ROOT/tools/bin/sdkmanager --licenses || true

      - name: Build APK
        run: |
          export PATH=$PATH:~/.local/bin/
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
