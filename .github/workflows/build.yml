name: Universal Auto-Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip lib32stdc++6 lib32z1 lib32ncurses6 libltdl-dev autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
      - name: Fix pip and Buildozer
        run: |
          python -m pip install --upgrade pip==23.3.2
          pip install buildozer cython==0.29.36
          pip install python-for-android
      - name: Auto-Heal Project Files
        run: |
          if [ ! -f main.py ] && [ -f app.py ]; then mv app.py main.py; fi
          if [ ! -f buildozer.spec ]; then pip install buildozer && buildozer init; fi
      - name: Build APK
        run: buildozer android debug
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Find and Upload APK
        run: |
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then echo "APK not found!"; exit 1; fi
          mkdir -p output
          cp "$APK_PATH" output/app-debug.apk
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk
          path: output/app-debug.apk
