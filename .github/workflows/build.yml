name: Final Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk lib32stdc++6 lib32z1 lib32ncurses6 libltdl-dev autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
      - name: Prepare buildozer.spec
        run: |
          if [ ! -f buildozer.spec ]; then pip install buildozer && buildozer init; fi
          sed -i 's/^requirements = .*/requirements = python3,kivy,pyjnius/' buildozer.spec
          sed -i 's/^android.accept_sdk_license = .*/android.accept_sdk_license = True/' buildozer.spec
      - name: Install Buildozer
        run: pip install buildozer cython
      - name: Build APK
        run: |
          if [ ! -f main.py ] && [ -f app.py ]; then mv app.py main.py; fi
          buildozer android debug
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk
          path: bin/*.apk
